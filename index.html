    let cart = {};

    let deferredPrompt = null;

    function loadSavedUserData() {
      const savedName = localStorage.getItem('client_name');
      const savedContact = localStorage.getItem('client_contact');
      const savedAddress = localStorage.getItem('client_address');

      if (savedName) document.getElementById('client-name').value = savedName;
      if (savedContact) document.getElementById('client-contact').value = savedContact;
      if (savedAddress) document.getElementById('client-address').value = savedAddress;
    }

    async function saveClientToDatabase(name, contact, address) {
      localStorage.setItem('client_name', name);
      localStorage.setItem('client_contact', contact);
      localStorage.setItem('client_address', address);

      try {
        await _supabase.from('clients').upsert(
          { name, contact, address, last_order_at: new Date() },
          { onConflict: 'contact' }
        );
      } catch (e) {
        console.error('Client save error:', e);
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.remove('hidden');
    });

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    
    if (isIOS && !isStandalone) {
      document.getElementById('install-banner').classList.remove('hidden');
    }

    async function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-banner').classList.add('hidden');
        }
        deferredPrompt = null;
      } else if (isIOS) {
        alert('Safari -> "Share" ⎋ -> "Add to Home Screen" ➕');
      } else {
        alert('Menu (⋮) -> "Add to Home Screen"');
      }
    }

    async function initCatalog() {
      try {
        loadSavedUserData();
        applyLanguage(currentLang);

        const { data: settings } = await _supabase.from('settings').select('*').single();
        if (settings && settings.status_text) {
          document.getElementById('status-banner').innerText = settings.status_text;
        }

        const { data: products } = await _supabase.from('products').select('*').order('id', { ascending: true });
        const container = document.getElementById('products-container');

        if (!products || products.length === 0) {
          container.innerHTML = `<p class="text-center text-gray-500 py-8">${translations[currentLang].noProducts}</p>`;
          return;
        }

        productsCache = products;
        renderCatalog(products);

      } catch (err) {
        console.error(err);
      }
    }

    function renderCatalog(products) {
      const container = document.getElementById('products-container');
      const navContainer = document.getElementById('category-nav');
      const t = translations[currentLang];
      container.innerHTML = '';
      navContainer.innerHTML = '';

      const groups = {};
      products.forEach(p => {
        if (!p.is_available) return;
        const cat = p.category || 'ОВОЧІ';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(p);
      });

      if (Object.keys(groups).length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-8">${t.allDisabled}</p>`;
        return;
      }

      for (const category in groups) {
        const translatedCategory = getTranslatedTerm(category);

        const catBtn = document.createElement('button');
        catBtn.className = "bg-white text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-200 shadow-sm hover:bg-emerald-50 transition";
        catBtn.innerText = translatedCategory;
        catBtn.onclick = () => {
          const el = document.getElementById(`cat-section-${category}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        navContainer.appendChild(catBtn);

        const section = document.createElement('div');
        section.id = `cat-section-${category}`;
        section.className = "space-y-2 pt-2";
        section.innerHTML = `<h2 class="text-sm font-bold text-emerald-700 uppercase tracking-wider px-1">${translatedCategory}</h2>`;
        
        const itemsWrapper = document.createElement('div');
        itemsWrapper.className = "space-y-2";

        groups[category].forEach(p => {
          const translatedTitle = getTranslatedTerm(p.title);
          const card = document.createElement('div');
          card.className = "bg-white p-3.5 rounded-xl shadow-sm border flex flex-col justify-between";
          
          let photoButtonHtml = '';
          let photoContainerHtml = '';
          
          if (p.image_url) {
            photoButtonHtml = `<button onclick="togglePhoto(${p.id})" class="text-xs text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-2 py-0.5 rounded font-medium transition">${t.photoBtn}</button>`;
            photoContainerHtml = `<div id="photo-${p.id}" class="hidden mt-2 pt-2 border-t"><img src="${p.image_url}" alt="${translatedTitle}" class="w-full h-40 object-cover rounded-lg shadow-inner"></div>`;
          }

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div class="space-y-0.5">
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-gray-800 text-sm sm:text-base">${translatedTitle}</h3>
                  ${photoButtonHtml}
                </div>
                <p class="text-sm font-semibold text-emerald-600">${p.price} Лек <span class="text-xs text-gray-400 font-normal">/ ${p.unit}</span></p>
              </div>
              <div class="flex items-center space-x-2">
                <button type="button" onclick="changeQty(${p.id}, -1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold text-gray-600 hover:bg-gray-200">-</button>
                <span id="qty-${p.id}" class="font-bold text-sm min-w-[20px] text-center">${cart[p.id] ? cart[p.id].qty : 0}</span>
                <button type="button" onclick="changeQty(${p.id}, 1)" class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 font-bold hover:bg-emerald-200">+</button>
              </div>
            </div>
            ${photoContainerHtml}
          `;
          itemsWrapper.appendChild(card);
        });

        section.appendChild(itemsWrapper);
        container.appendChild(section);
      }
    }

    function togglePhoto(id) {
      const el = document.getElementById(`photo-${id}`);
      if (el) el.classList.toggle('hidden');
    }

    function changeQty(id, change) {
      const product = productsCache.find(p => p.id === id);
      if (!product) return;

      if (!cart[id]) {
        cart[id] = { title: product.title, price: product.price, unit: product.unit, qty: 0 };
      }
      cart[id].qty += change;
      if (cart[id].qty <= 0) delete cart[id];

      const qtyEl = document.getElementById(`qty-${id}`);
      if (qtyEl) qtyEl.innerText = cart[id] ? cart[id].qty : 0;
      updateCartUI();
    }

    function updateCartUI() {
      const t = translations[currentLang];
      let total = 0;
      let count = 0;
      for (const id in cart) {
        total += cart[id].price * cart[id].qty;
        count += cart[id].qty;
      }

      document.getElementById('cart-total').innerText = total;
      document.getElementById('cart-count').innerText = count;

      const deliveryStatus = document.getElementById('delivery-status');
      if (total >= 2500) {
        deliveryStatus.innerHTML = t.freeDelivery;
      } else {
        const diff = 2500 - total;
        deliveryStatus.innerHTML = t.deliveryDiff.replace('{diff}', diff);
      }

      const cartBar = document.getElementById('cart-bar');
      if (count > 0) cartBar.classList.remove('hidden');
      else cartBar.classList.add('hidden');
    }

    function openCheckoutModal() {
      const t = translations[currentLang];
      const list = document.getElementById('cart-items-list');
      list.innerHTML = '';
      let total = 0;

      for (const id in cart) {
        const item = cart[id];
        const sum = item.price * item.qty;
        total += sum;
        const translatedTitle = getTranslatedTerm(item.title);
        list.innerHTML += `<div class="flex justify-between"><span>${translatedTitle} (${item.qty} ${item.unit})</span> <span class="font-semibold">${sum} Лек</span></div>`;
      }

      const modalNotice = document.getElementById('modal-delivery-notice');
      if (total >= 2500) {
        modalNotice.innerHTML = t.modalFreeNotice;
      } else {
        const diff = 2500 - total;
        modalNotice.innerHTML = t.modalDiffNotice.replace('{diff}', diff);
      }

      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    async function sendOrder(e) {
      e.preventDefault();
      const t = translations[currentLang];
      
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = t.sendingBtn;

      const name = document.getElementById('client-name').value;
      const contact = document.getElementById('client-contact').value;
      const address = document.getElementById('client-address').value;
      const deliveryTime = document.getElementById('delivery-time').value;
      const comment = document.getElementById('client-comment').value;

      await saveClientToDatabase(name, contact, address);

      let orderText = `🛒 Нове замовлення у Дурресі! (Мова: ${currentLang.toUpperCase()})\n\n`;
      orderText += `👤 Ім'я: ${name}\n`;
      orderText += `📞 Контакт: ${contact}\n`;
      orderText += `📍 Адреса: ${address}\n`;
      orderText += `⏰ Час доставки: ${deliveryTime}\n`;
      if (comment) orderText += `💬 Коментар: ${comment}\n\n`;
      orderText += `📦 Товари у кошику:\n`;

      let total = 0;
      for (const id in cart) {
        const item = cart[id];
        const sum = item.price * item.qty;
        total += sum;
        orderText += `• ${item.title}: ${item.qty} ${item.unit} = ${sum} Лек\n`;
      }

      if (total >= 2500) {
        orderText += `\n💰 Загальна сума: ~${total} Лек (🎉 Безкоштовна доставка)`;
      } else {
        orderText += `\n💰 Загальна сума: ~${total} Лек (з урахуванням доставки)`;
      }

      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: orderText
          })
        });

        const resData = await response.json();

        if (resData.ok) {
          alert(t.successAlert);
          closeCheckoutModal();
          cart = {};
          renderCatalog(productsCache);
          updateCartUI();
        } else {
          alert('Error: ' + (resData.description || 'Bot error'));
        }
      } catch (err) {
        alert("Connection error.");
      } finally {
        btn.disabled = false;
        btn.innerText = t.submitBtn;
      }
    }

    initCatalog();
  </script>
</body>
</html>
