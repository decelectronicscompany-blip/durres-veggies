<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доставка фруктів та овочів | Дуррес</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 pb-28 font-sans text-gray-800">

  <!-- Шапка -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto">
      <h1 class="text-xl font-bold">🥑 Фрукти & Овочі Дуррес</h1>
      <p id="status-banner" class="text-xs bg-emerald-700/60 mt-1 p-1.5 rounded-lg text-emerald-100 font-medium">
        Завантаження статусу...
      </p>
    </div>
  </header>

  <!-- Каталог для покупців -->
  <main class="max-w-md mx-auto p-4 space-y-6" id="products-container">
    <p class="text-center text-gray-400 py-8">Завантаження свіжих продуктів...</p>
  </main>

  <!-- Нижній кошик -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg hidden z-20">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <p id="delivery-status" class="text-xs font-semibold text-emerald-600">🚚 Безкоштовна доставка від 2500 Лек</p>
        <p class="text-lg font-bold text-gray-800">Сума: <span id="cart-total" class="text-emerald-600">0</span> Лек</p>
      </div>
      <button onclick="openCheckoutModal()" class="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl shadow-md hover:bg-emerald-700">
        Кошик (<span id="cart-count">0</span>)
      </button>
    </div>
  </div>

  <!-- Модальне вікно замовлення -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full max-w-md p-6 rounded-t-2xl sm:rounded-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold">Ваше замовлення</h2>
        <button onclick="closeCheckoutModal()" class="text-gray-400 text-xl font-bold">&times;</button>
      </div>

      <div id="cart-items-list" class="space-y-2 text-sm max-h-40 overflow-y-auto border-b pb-2"></div>

      <div id="modal-delivery-notice" class="text-xs bg-emerald-50 text-emerald-800 p-2.5 rounded-lg font-medium"></div>

      <form onsubmit="sendOrder(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ваше ім'я</label>
          <input id="client-name" type="text" required class="w-full border p-2 rounded-lg text-sm" placeholder="Олена">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Телефон або Telegram/WhatsApp</label>
          <input id="client-contact" type="text" required class="w-full border p-2 rounded-lg text-sm" placeholder="+380... або @username">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Адреса доставки в Дурресі</label>
          <input id="client-address" type="text" required class="w-full border p-2 rounded-lg text-sm" placeholder="Район, вулиця, номер будинку/апартаментів">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Коментар (за бажанням)</label>
          <textarea id="client-comment" class="w-full border p-2 rounded-lg text-sm" rows="2" placeholder="Наприклад: зеленіші банани, підняти на 3 поверх"></textarea>
        </div>

        <button id="submit-btn" type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700">
          Надіслати замовлення
        </button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pynhbjloaqjxrldfsbxk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Mk1VZRJvR_s3Ynltjf1nsQ_bCbIy7m_';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TELEGRAM_BOT_TOKEN = '8538982296:AAHlJGl53crEUA2ypj8Tp-L5_8xyeiPTJUs';
    const TELEGRAM_CHAT_ID = '8487483803';

    let cart = {};
    let productsCache = [];

    async function initCatalog() {
      try {
        const { data: settings } = await _supabase.from('settings').select('*').single();
        if (settings && settings.status_text) {
          document.getElementById('status-banner').innerText = settings.status_text;
        }

        const { data: products } = await _supabase.from('products').select('*').order('id', { ascending: true });
        const container = document.getElementById('products-container');
        container.innerHTML = '';

        if (!products || products.length === 0) {
          container.innerHTML = '<p class="text-center text-gray-500 py-8">Наразі немає доступних товарів.</p>';
          return;
        }

        productsCache = products;
        renderCatalog(products);

      } catch (err) {
        console.error(err);
      }
    }

    function renderCatalog(products) {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      const groups = {};
      products.forEach(p => {
        if (!p.is_available) return;
        const cat = p.category || 'ОВОЧІ';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(p);
      });

      if (Object.keys(groups).length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-8">Всі товари тимчасово вимкнені.</p>';
        return;
      }

      for (const category in groups) {
        const section = document.createElement('div');
        section.className = "space-y-2";
        section.innerHTML = `<h2 class="text-sm font-bold text-emerald-700 uppercase tracking-wider px-1">${category}</h2>`;
        
        const itemsWrapper = document.createElement('div');
        itemsWrapper.className = "space-y-2";

        groups[category].forEach(p => {
          const card = document.createElement('div');
          card.className = "bg-white p-3.5 rounded-xl shadow-sm border flex flex-col justify-between";
          
          let photoButtonHtml = '';
          let photoContainerHtml = '';
          
          if (p.image_url) {
            photoButtonHtml = `<button onclick="togglePhoto(${p.id})" class="text-xs text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-2 py-0.5 rounded font-medium transition">📷 Фото</button>`;
            photoContainerHtml = `<div id="photo-${p.id}" class="hidden mt-2 pt-2 border-t"><img src="${p.image_url}" alt="${p.title}" class="w-full h-40 object-cover rounded-lg shadow-inner"></div>`;
          }

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <div class="space-y-0.5">
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-gray-800 text-sm sm:text-base">${p.title}</h3>
                  ${photoButtonHtml}
                </div>
                <p class="text-sm font-semibold text-emerald-600">${p.price} Лек <span class="text-xs text-gray-400 font-normal">/ ${p.unit}</span></p>
              </div>
              <div class="flex items-center space-x-2">
                <button type="button" onclick="changeQty(${p.id}, -1)" class="w-8 h-8 rounded-lg bg-gray-100 font-bold text-gray-600 hover:bg-gray-200">-</button>
                <span id="qty-${p.id}" class="font-bold text-sm min-w-[20px] text-center">${cart[p.id] ? cart[p.id].qty : 0}</span>
                <button type="button" onclick="changeQty(${p.id}, 1)" class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 font-bold hover:bg-emerald-200">+</button>
              </div>
            </div>
            ${photoContainerHtml}
          `;
          itemsWrapper.appendChild(card);
        });

        section.appendChild(itemsWrapper);
        container.appendChild(section);
      }
    }

    function togglePhoto(id) {
      const el = document.getElementById(`photo-${id}`);
      if (el) el.classList.toggle('hidden');
    }

    function changeQty(id, change) {
      const product = productsCache.find(p => p.id === id);
      if (!product) return;

      if (!cart[id]) {
        cart[id] = { title: product.title, price: product.price, unit: product.unit, qty: 0 };
      }
      cart[id].qty += change;
      if (cart[id].qty <= 0) delete cart[id];

      const qtyEl = document.getElementById(`qty-${id}`);
      if (qtyEl) qtyEl.innerText = cart[id] ? cart[id].qty : 0;
      updateCartUI();
    }

    function updateCartUI() {
      let total = 0;
      let count = 0;
      for (const id in cart) {
        total += cart[id].price * cart[id].qty;
        count += cart[id].qty;
      }

      document.getElementById('cart-total').innerText = total;
      document.getElementById('cart-count').innerText = count;

      const deliveryStatus = document.getElementById('delivery-status');
      if (total >= 2500) {
        deliveryStatus.innerHTML = "🎉 У вас безкоштовна доставка!";
      } else {
        const diff = 2500 - total;
        deliveryStatus.innerHTML = `🚚 До безкоштовної доставки: ще ${diff} Лек`;
      }

      const cartBar = document.getElementById('cart-bar');
      if (count > 0) cartBar.classList.remove('hidden');
      else cartBar.classList.add('hidden');
    }

    function openCheckoutModal() {
      const list = document.getElementById('cart-items-list');
      list.innerHTML = '';
      let total = 0;

      for (const id in cart) {
        const item = cart[id];
        const sum = item.price * item.qty;
        total += sum;
        list.innerHTML += `<div class="flex justify-between"><span>${item.title} (${item.qty} ${item.unit})</span> <span class="font-semibold">${sum} Лек</span></div>`;
      }

      const modalNotice = document.getElementById('modal-delivery-notice');
      if (total >= 2500) {
        modalNotice.innerHTML = "🎉 Сума замовлення дозволяє отримати <b>безкоштовну доставку</b>!";
      } else {
        const diff = 2500 - total;
        modalNotice.innerHTML = `💡 Додайте товарів ще на <b>${diff} Лек</b> для безкоштовної доставки (від 2500 Лек).`;
      }

      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    async function sendOrder(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Надсилання...';

      const name = document.getElementById('client-name').value;
      const contact = document.getElementById('client-contact').value;
      const address = document.getElementById('client-address').value;
      const comment = document.getElementById('client-comment').value;

      let orderText = `🛒 Нове замовлення у Дурресі!\n\n`;
      orderText += `👤 Ім'я: ${name}\n`;
      orderText += `📞 Контакт: ${contact}\n`;
      orderText += `📍 Адреса: ${address}\n`;
      if (comment) orderText += `💬 Коментар: ${comment}\n\n`;
      orderText += `📦 Товари у кошику:\n`;

      let total = 0;
      for (const id in cart) {
        const item = cart[id];
        const sum = item.price * item.qty;
        total += sum;
        orderText += `• ${item.title}: ${item.qty} ${item.unit} = ${sum} Лек\n`;
      }

      if (total >= 2500) {
        orderText += `\n💰 Загальна сума: ~${total} Лек (🎉 Безкоштовна доставка)`;
      } else {
        orderText += `\n💰 Загальна сума: ~${total} Лек (з урахуванням доставки)`;
      }

      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: orderText
          })
        });

        const resData = await response.json();

        if (resData.ok) {
          alert('Дякуємо! Ваше замовлення прийнято в обробку.');
          closeCheckoutModal();
          cart = {};
          renderCatalog(productsCache);
          updateCartUI();
        } else {
          alert('Помилка надсилання: ' + (resData.description || 'Перевірте бота'));
        }
      } catch (err) {
        alert("Помилка з'єднання.");
      } finally {
        btn.disabled = false;
        btn.innerText = 'Надіслати замовлення';
      }
    }

    initCatalog();
  </script>
</body>
</html>
