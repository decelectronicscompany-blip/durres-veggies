<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель | Доставка Дуррес</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans text-gray-800">

  <div class="max-w-3xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-2xl font-bold text-emerald-600">⚙️ Адмін-панель</h1>
      <a href="index.html" target="_blank" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg font-medium">👀 Відкрити сайт</a>
    </div>

    <!-- Блок-статус на сайті -->
    <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
      <h2 class="text-lg font-bold text-gray-700">📌 Блок-статус на сайті</h2>
      <div class="flex flex-col sm:flex-row gap-3">
        <input id="status-input" type="text" class="flex-1 border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Замовлення на сьогодні приймаються до 14:00 🧅">
        <button onclick="updateStatus()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-lg transition">Зберегти</button>
      </div>
    </div>

    <!-- Додавання нового товару -->
    <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
      <h2 class="text-lg font-bold text-gray-700">➕ Додати новий товар</h2>
      <form id="add-product-form" onsubmit="addProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Назва товару</label>
          <input id="new-title" type="text" placeholder="Яблука Гала" required class="w-full border p-2 rounded-lg text-sm">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Категорія</label>
          <select id="new-category-select" onchange="handleCategoryChange(this)" class="w-full border p-2 rounded-lg text-sm bg-white">
            <option value="ОВОЧІ">🍅 Овочі</option>
            <option value="ФРУКТИ">🍏 Фрукти</option>
            <option value="ЗЕЛЕНЬ">🌿 Зелень</option>
            <option value="ЯГОДИ">🍓 Ягоди</option>
            <option value="ІНШЕ">🛒 Інше</option>
            <option value="__NEW__">➕ Створити нову категорію...</option>
          </select>
          <input id="new-category-custom" type="text" placeholder="Введіть назву категорії" class="w-full border p-2 rounded-lg text-sm mt-2 hidden">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ціна (Лек)</label>
          <input id="new-price" type="number" placeholder="180" required class="w-full border p-2 rounded-lg text-sm">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Одиниця виміру</label>
          <select id="new-unit" class="w-full border p-2 rounded-lg text-sm bg-white">
            <option value="кг">кг</option>
            <option value="шт">шт</option>
            <option value="пучок">пучок</option>
            <option value="упаковка">упаковка</option>
            <option value="сітка">сітка</option>
            <option value="лоток">лоток</option>
          </select>
        </div>

        <div class="sm:col-span-2 space-y-2 border-t pt-3 mt-1">
          <label class="block text-xs font-semibold text-gray-600">Завантажити фото товару:</label>
          <input id="new-image-file" type="file" accept="image/*" class="w-full border p-2 rounded-lg text-sm bg-gray-50 file:mr-4 file:py-1.5 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
          <p class="text-[11px] text-gray-400">Або вкажіть пряме посилання на фото (URL):</p>
          <input id="new-image-url" type="url" placeholder="https://..." class="w-full border p-2 rounded-lg text-sm">
        </div>

        <button type="submit" id="submit-btn" class="sm:col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition mt-2">
          Додати товар у каталог
        </button>
      </form>
    </div>

    <!-- Список товарів -->
    <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
      <h2 class="text-lg font-bold text-gray-700">🥗 Управління позиціями</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-gray-500 text-sm">
              <th class="pb-2">Товар / Категорія</th>
              <th class="pb-2 w-28">Ціна (Лек)</th>
              <th class="pb-2 text-center">Наявність</th>
              <th class="pb-2 text-right">Дії</th>
            </tr>
          </thead>
          <tbody id="products-list" class="divide-y">
            <!-- Завантажується динамічно -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- База клієнтів -->
    <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
      <h2 class="text-lg font-bold text-gray-700">👥 База постійних клієнтів</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b text-gray-500 text-sm">
              <th class="pb-2">Ім'я</th>
              <th class="pb-2">Контакт</th>
              <th class="pb-2">Адреса в Дурресі</th>
              <th class="pb-2 text-right">Останнє замовлення</th>
            </tr>
          </thead>
          <tbody id="clients-list" class="divide-y text-sm">
            <!-- Завантажується динамічно -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://pynhbjloaqjxrldfsbxk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Mk1VZRJvR_s3Ynltjf1nsQ_bCbIy7m_';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadAdminData() {
      const { data: settings } = await _supabase.from('settings').select('*').single();
      if (settings) {
        document.getElementById('status-input').value = settings.status_text;
      }

      // Завантаження товарів
      const { data: products } = await _supabase.from('products').select('*').order('id', { ascending: false });
      const tbody = document.getElementById('products-list');
      tbody.innerHTML = '';

      if (!products || products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-400">Товари відсутні</td></tr>`;
      } else {
        const customCategories = new Set(['ОВОЧІ', 'ФРУКТИ', 'ЗЕЛЕНЬ', 'ЯГОДИ', 'ІНШЕ']);
        products.forEach(p => { if (p.category) customCategories.add(p.category.toUpperCase()); });
        
        const selectEl = document.getElementById('new-category-select');
        const currentValue = selectEl.value;
        selectEl.innerHTML = '';
        customCategories.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat;
          option.innerText = cat;
          selectEl.appendChild(option);
        });
        const newOption = document.createElement('option');
        newOption.value = '__NEW__';
        newOption.innerText = '➕ Створити нову категорію...';
        selectEl.appendChild(newOption);
        selectEl.value = currentValue !== '__NEW__' && customCategories.has(currentValue) ? currentValue : Array.from(customCategories)[0];

        products.forEach(p => {
          const tr = document.createElement('tr');
          tr.className = p.is_available ? '' : 'bg-gray-50 opacity-60';
          tr.innerHTML = `
            <td class="py-3">
              <div class="flex items-center gap-3">
                ${p.image_url ? `<img src="${p.image_url}" class="w-10 h-10 object-cover rounded-lg border">` : `<div class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center text-xs text-gray-400">📷</div>`}
                <div>
                  <div class="font-bold text-gray-800">${p.title}</div>
                  <div class="text-xs text-emerald-600 font-semibold uppercase">${p.category || 'ОВОЧІ'} • <span class="text-gray-400 font-normal">${p.unit}</span></div>
                </div>
              </div>
            </td>
            <td class="py-3">
              <input type="number" value="${p.price}" onchange="updatePrice(${p.id}, this.value)" class="w-20 border px-2 py-1 rounded text-sm font-semibold">
            </td>
            <td class="py-3 text-center">
              <button onclick="toggleAvailability(${p.id}, ${p.is_available})" class="px-3 py-1 rounded-full text-xs font-bold ${p.is_available ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                ${p.is_available ? '🟢 В наявності' : '🔴 Вимкнено'}
              </button>
            </td>
            <td class="py-3 text-right">
              <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700 text-sm font-bold px-2 py-1">🗑</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Завантаження бази клієнтів
      const { data: clients } = await _supabase.from('clients').select('*').order('last_order_at', { ascending: false });
      const clientsTbody = document.getElementById('clients-list');
      clientsTbody.innerHTML = '';

      if (!clients || clients.length === 0) {
        clientsTbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-400">Поки немає зареєстрованих клієнтів</td></tr>`;
      } else {
        clients.forEach(c => {
          const dateStr = c.last_order_at ? new Date(c.last_order_at).toLocaleDateString('uk-UA') : '-';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="py-3 font-semibold text-gray-800">${c.name}</td>
            <td class="py-3 text-emerald-600 font-medium">${c.contact}</td>
            <td class="py-3 text-gray-600">${c.address || '-'}</td>
            <td class="py-3 text-right text-xs text-gray-400">${dateStr}</td>
          `;
          clientsTbody.appendChild(tr);
        });
      }
    }

    function handleCategoryChange(select) {
      const customInput = document.getElementById('new-category-custom');
      if (select.value === '__NEW__') {
        customInput.classList.remove('hidden');
        customInput.required = true;
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
      }
    }

    async function updateStatus() {
      const text = document.getElementById('status-input').value;
      await _supabase.from('settings').update({ status_text: text }).eq('id', 1);
      alert('Статус оновлено!');
    }

    async function updatePrice(id, newPrice) {
      await _supabase.from('products').update({ price: parseFloat(newPrice) }).eq('id', id);
    }

    async function toggleAvailability(id, currentStatus) {
      await _supabase.from('products').update({ is_available: !currentStatus }).eq('id', id);
      loadAdminData();
    }

    function compressImage(file, maxWidth = 600, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    async function addProduct(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Обробка та збереження...';

      const title = document.getElementById('new-title').value;
      const selectCat = document.getElementById('new-category-select').value;
      const customCat = document.getElementById('new-category-custom').value.trim();
      
      let category = selectCat === '__NEW__' ? customCat.toUpperCase() : selectCat;
      if (!category) category = 'ІНШЕ';

      const price = parseFloat(document.getElementById('new-price').value);
      const unit = document.getElementById('new-unit').value;
      
      const fileInput = document.getElementById('new-image-file');
      const urlInput = document.getElementById('new-image-url').value.trim();

      let image_url = urlInput || null;

      if (fileInput.files && fileInput.files[0]) {
        image_url = await compressImage(fileInput.files[0]);
      }

      await _supabase.from('products').insert([{ title, category, price, unit, image_url, is_available: true }]);
      
      document.getElementById('add-product-form').reset();
      document.getElementById('new-category-custom').classList.add('hidden');
      submitBtn.disabled = false;
      submitBtn.innerText = 'Додати товар у каталог';
      loadAdminData();
    }

    async function deleteProduct(id) {
      if (confirm('Видалити цей товар?')) {
        await _supabase.from('products').delete().eq('id', id);
        loadAdminData();
      }
    }

    loadAdminData();
  </script>
</body>
</html>
